<!doctype html>

<title>Not found</title>
<!--
  Served by CloudFront for both 403 and 404 (see the edge stack's errorResponses),
  from the <bucket>/www/404.html key. It renders on foreign subdomains, so it must
  stay fully self-contained: no external CSS, fonts, images or scripts.
-->
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font: 16px/1.5 system-ui, -apple-system, sans-serif;
         background: #11131a; color: #e6e8ee; }
  main { text-align: center; padding: 2rem; }
  h1 { font-size: 4rem; margin: 0; letter-spacing: -0.03em; }
  p { opacity: 0.7; margin: 0.5rem 0 0; }
</style>
<main>
  <h1>404</h1>
  <p>Nothing here.</p>
</main>
